_format_version: "3.0"

services:
  - name: payment-service
    host: httpbin.konghq.com
    port: 443
    protocol: https
    path: /anything
    tags:
      - scene-2

routes:
  - name: payment-route
    service:
      name: payment-service
    paths:
      - /payments
    strip_path: true
    tags:
      - scene-2
    plugins:
      - name: key-auth
        config:
          key_names:
            - apikey
          hide_credentials: true

consumers:
  - username: mobile-app
    tags:
      - scene-2
    keyauth_credentials:
      - key: mobile-key-12345
    groups:
      - name: premium

  - username: web-app
    tags:
      - scene-2
    keyauth_credentials:
      - key: web-key-67890
    groups:
      - name: basic

consumer_groups:
  - name: premium
  - name: basic

plugins:
  - name: acl
    route: payment-route
    config:
      include_consumer_groups: true
      allow:
        - premium
    tags:
      - scene-2
