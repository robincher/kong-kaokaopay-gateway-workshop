_format_version: "3.0"

services:
  - name: payment-api-v1
    host: api-backend    # upstream name
    port: 443
    protocol: https
    path: /headers
    tags:
      - scene-3
      - v1

  - name: payment-api-v2
    host: httpbin.konghq.com
    port: 443
    protocol: https
    path: /uuid
    tags:
      - scene-3
      - v2

routes:
  - name: api-route
    service:
      name: payment-api-v1
    paths:
      - /api
    strip_path: true
    tags:
      - scene-3
    plugins:
      - name: rate-limiting
        # enabled: false
        config:
          minute: 10
          policy: local
          limit_by: consumer
          hide_client_headers: false

upstreams:
  - name: api-backend
    algorithm: round-robin
    targets:
      # Hostname targets expand to one balancer slot per DNS A record.
      # httpbin.konghq.com -> 1 IP, httpbin.org -> 8 IPs (as of workshop date).
      # With weight 90/10 that becomes 90 vs 8*10=80 (~52/48), not 90/10.
      - target: httpbin.konghq.com:443
        weight: 90
        tags:
          - v1

      - target: httpbin.org:443
        weight: 1
        tags:
          - v2

