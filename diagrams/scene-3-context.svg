<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      .box { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
      .gateway { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2; }
      .backend { fill: #d1fae5; stroke: #10b981; stroke-width: 2; }
      .allowed { fill: #dcfce7; stroke: #22c55e; stroke-width: 2; }
      .warn { fill: #fef08a; stroke: #eab308; stroke-width: 2; }
      .text { font-family: 'Segoe UI', sans-serif; font-size: 14px; fill: #1f2937; }
      .title { font-size: 18px; font-weight: bold; fill: #1f2937; }
      .label { font-size: 12px; fill: #6b7280; }
      .arrow { stroke: #6b7280; stroke-width: 2; marker-end: url(#arrowhead); }
      .thick { stroke-width: 3; }
      .thin { stroke-width: 1; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6b7280" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="30" class="title" text-anchor="middle">Scene 3: Traffic Management (Rate Limiting &amp; Canary Release)</text>

  <!-- Client -->
  <rect x="40" y="80" width="140" height="100" rx="8" class="box"/>
  <text x="110" y="115" class="text" text-anchor="middle" font-weight="bold">Client</text>
  <text x="110" y="140" class="text" text-anchor="middle" font-size="12">HTTP Requests</text>
  <text x="110" y="160" class="text" text-anchor="middle" font-size="11">x12 per minute</text>

  <!-- Kong Gateway -->
  <g>
    <rect x="210" y="60" width="650" height="340" rx="8" class="gateway" fill="none" stroke-dasharray="5,5"/>
    <text x="535" y="85" class="label" text-anchor="middle">KONG GATEWAY</text>

    <!-- Rate Limiting Plugin -->
    <rect x="230" y="110" width="160" height="90" rx="8" class="gateway"/>
    <text x="310" y="140" class="text" text-anchor="middle" font-weight="bold">Rate Limiting</text>
    <text x="310" y="165" class="text" text-anchor="middle" font-size="11">Limit: 10 req/min</text>
    <text x="310" y="185" class="text" text-anchor="middle" font-size="10">Policy: local</text>

    <!-- Arrow to Traffic Split -->
    <path d="M 390 155 L 430 155" class="arrow"/>

    <!-- Traffic Split -->
    <rect x="430" y="110" width="140" height="90" rx="8" class="gateway"/>
    <text x="500" y="140" class="text" text-anchor="middle" font-weight="bold">Canary Split</text>
    <text x="500" y="165" class="text" text-anchor="middle" font-size="11">90% : 10%</text>

    <!-- Split to v1 and v2 -->
    <path d="M 500 200 L 380 280" class="arrow thick"/>
    <path d="M 500 200 L 620 280" class="arrow thin"/>

    <!-- Service v1 (90%) -->
    <rect x="300" y="280" width="140" height="90" rx="8" class="allowed"/>
    <text x="370" y="310" class="text" text-anchor="middle" font-weight="bold">Service v1</text>
    <text x="370" y="335" class="text" text-anchor="middle" font-size="11">Stable (90%)</text>
    <text x="370" y="355" class="text" text-anchor="middle" font-size="10">/json</text>

    <!-- Service v2 (10%) -->
    <rect x="540" y="280" width="140" height="90" rx="8" class="warn"/>
    <text x="610" y="310" class="text" text-anchor="middle" font-weight="bold">Service v2</text>
    <text x="610" y="335" class="text" text-anchor="middle" font-size="11">Canary (10%)</text>
    <text x="610" y="355" class="text" text-anchor="middle" font-size="10">/uuid</text>
  </g>

  <!-- Rate Limit Results -->
  <g>
    <text x="40" y="465" class="title">Rate Limiting Results</text>

    <!-- Pass -->
    <rect x="40" y="485" width="140" height="60" rx="8" class="allowed"/>
    <text x="110" y="510" class="text" text-anchor="middle" font-weight="bold">✓ Requests 1-10</text>
    <text x="110" y="535" class="text" text-anchor="middle" font-size="11">HTTP 200 OK</text>

    <!-- Fail -->
    <rect x="200" y="485" width="140" height="60" rx="8" class="warn"/>
    <text x="270" y="510" class="text" text-anchor="middle" font-weight="bold">✗ Requests 11-12</text>
    <text x="270" y="535" class="text" text-anchor="middle" font-size="11">HTTP 429 Limited</text>

    <!-- Headers -->
    <rect x="360" y="485" width="200" height="60" rx="8" class="gateway"/>
    <text x="460" y="510" class="text" text-anchor="middle" font-weight="bold">Rate Limit Headers</text>
    <text x="460" y="530" class="text" text-anchor="middle" font-size="10">RateLimit-Remaining, RateLimit-Reset</text>
  </g>

  <!-- Backends -->
  <g>
    <text x="600" y="465" class="title">Backends</text>

    <!-- v1 Backend -->
    <rect x="560" y="485" width="150" height="60" rx="8" class="backend"/>
    <text x="635" y="515" class="text" text-anchor="middle">httpbin.konghq.com</text>
    <text x="635" y="535" class="text" text-anchor="middle" font-size="10">/json endpoint</text>
  </g>

  <!-- Traffic Distribution -->
  <g>
    <text x="40" y="600" class="title">Traffic Distribution (10 requests)</text>

    <text x="40" y="630" class="text">Expected: ~9 requests to v1 (stable), ~1 request to v2 (canary)</text>
    <text x="40" y="650" class="text">This allows testing v2 with minimal customer impact</text>
  </g>

  <!-- Use Cases -->
  <g>
    <text x="520" y="600" class="title">Real-World Use Cases</text>

    <text x="520" y="630" class="text">• API Quota Management by tier</text>
    <text x="520" y="650" class="text">• DDoS Protection via global rate limits</text>
    <text x="520" y="670" class="text">• Blue-Green Deployments</text>
    <text x="520" y="690" class="text">• A/B Testing across versions</text>
  </g>

  <!-- Participant Actions -->
  <g>
    <text x="40" y="740" class="title">Participant Actions</text>

    <text x="40" y="765" class="text">1. Deploy rate limiting: 10 req/min per consumer</text>
    <text x="520" y="765" class="text">2. Configure two services for canary (v1, v2)</text>
  </g>

  <!-- Time estimate -->
  <text x="500" y="795" class="label" text-anchor="middle" font-size="11">⏱️ 40 minutes - Test rate limiting (12 requests) and canary traffic distribution</text>
</svg>
