<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      .box { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
      .gateway { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2; }
      .backend { fill: #d1fae5; stroke: #10b981; stroke-width: 2; }
      .text { font-family: 'Segoe UI', sans-serif; font-size: 14px; fill: #1f2937; }
      .title { font-size: 18px; font-weight: bold; fill: #1f2937; }
      .label { font-size: 12px; fill: #6b7280; }
      .arrow { stroke: #6b7280; stroke-width: 2; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 5,5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6b7280" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="30" class="title" text-anchor="middle">Scene 1: Services &amp; Routes</text>

  <!-- Client -->
  <rect x="50" y="100" width="150" height="100" rx="8" class="box"/>
  <text x="125" y="135" class="text" text-anchor="middle" font-weight="bold">Client</text>
  <text x="125" y="160" class="text" text-anchor="middle" font-size="12">HTTP Request</text>
  <text x="125" y="180" class="text" text-anchor="middle" font-size="12">/anything/test</text>

  <!-- Arrow Client to Route -->
  <path d="M 200 150 L 280 150" class="arrow"/>
  <text x="240" y="140" class="label">Request</text>

  <!-- Kong Gateway Box -->
  <g>
    <rect x="280" y="80" width="380" height="240" rx="8" class="gateway" fill="none" stroke-dasharray="5,5"/>
    <text x="470" y="105" class="label" text-anchor="middle">KONG GATEWAY</text>

    <!-- Route -->
    <rect x="300" y="130" width="160" height="80" rx="8" class="gateway"/>
    <text x="380" y="160" class="text" text-anchor="middle" font-weight="bold">Route</text>
    <text x="380" y="180" class="text" text-anchor="middle" font-size="12">json-route</text>
    <text x="380" y="200" class="text" text-anchor="middle" font-size="11">/anything*</text>

    <!-- Arrow Route to Service -->
    <path d="M 460 170 L 500 170" class="arrow"/>

    <!-- Service -->
    <rect x="500" y="130" width="140" height="80" rx="8" class="gateway"/>
    <text x="570" y="160" class="text" text-anchor="middle" font-weight="bold">Service</text>
    <text x="570" y="180" class="text" text-anchor="middle" font-size="12">httpbin-svc</text>
  </g>

  <!-- Arrow Kong to Backend -->
  <path d="M 660 200 L 720 200" class="arrow"/>
  <text x="690" y="190" class="label">HTTPS</text>

  <!-- Backend -->
  <rect x="720" y="100" width="200" height="100" rx="8" class="backend"/>
  <text x="820" y="135" class="text" text-anchor="middle" font-weight="bold">Backend</text>
  <text x="820" y="160" class="text" text-anchor="middle" font-size="12">httpbin.konghq.com</text>
  <text x="820" y="180" class="text" text-anchor="middle" font-size="11">(Mock Service)</text>

  <!-- Response Flow -->
  <path d="M 720 230 L 660 230" class="arrow dashed"/>
  <text x="690" y="220" class="label">Response</text>

  <!-- Analytics -->
  <rect x="280" y="280" width="380" height="60" rx="8" class="gateway"/>
  <text x="470" y="305" class="text" text-anchor="middle" font-weight="bold">Analytics Dashboard</text>
  <text x="470" y="325" class="text" text-anchor="middle" font-size="12">Request logged and visible in Konnect</text>

  <!-- Key Components Section -->
  <g>
    <text x="50" y="450" class="title">Key Components</text>

    <!-- Service -->
    <circle cx="100" cy="500" r="8" class="gateway"/>
    <text x="130" y="505" class="text"><tspan font-weight="bold">Service:</tspan> Upstream backend target</text>

    <!-- Route -->
    <circle cx="100" cy="550" r="8" class="gateway"/>
    <text x="130" y="555" class="text"><tspan font-weight="bold">Route:</tspan> Frontend entry point for clients</text>

    <!-- Host -->
    <circle cx="100" cy="600" r="8" class="gateway"/>
    <text x="130" y="605" class="text"><tspan font-weight="bold">Host:</tspan> kaokaopay.example.com</text>
  </g>

  <!-- Participant Actions -->
  <g>
    <text x="520" y="450" class="title">Participant Actions</text>

    <text x="520" y="480" class="text">1. Review decK configuration file</text>
    <text x="520" y="505" class="text">2. Deploy Service pointing to httpbin.konghq.com</text>
    <text x="520" y="530" class="text">3. Create Route matching /anything path</text>
    <text x="520" y="555" class="text">4. Send HTTP requests through Kong gateway</text>
    <text x="520" y="580" class="text">5. Verify traffic in Konnect analytics</text>
  </g>

  <!-- Time estimate -->
  <text x="500" y="680" class="label" text-anchor="middle" font-size="11">⏱️ 30-40 minutes including setup and testing</text>
</svg>
